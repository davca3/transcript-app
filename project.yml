name: Skribent
options:
  bundleIdPrefix: com.skribent
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    ENABLE_HARDENED_RUNTIME: YES

packages:
  WhisperKit:
    url: https://github.com/argmaxinc/WhisperKit
    from: "0.9.0"
  FluidAudio:
    url: https://github.com/FluidInference/FluidAudio
    from: "0.6.0"

targets:
  Skribent:
    type: application
    platform: macOS
    sources:
      - path: Skribent
        excludes:
          - "Resources/Info.plist"
          - "Resources/Skribent.entitlements"
    resources:
      - path: Skribent/Resources/Assets.xcassets
    info:
      path: Skribent/Resources/Info.plist
      properties:
        CFBundleName: Skribent
        CFBundleDisplayName: Skribent
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSMinimumSystemVersion: "14.0"
        NSMicrophoneUsageDescription: "Skribent potřebuje přístup k mikrofonu pro nahrávání přepisů."
        NSHighResolutionCapable: true
    entitlements:
      path: Skribent/Resources/Skribent.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.device.audio-input: true
        com.apple.security.files.user-selected.read-write: true
        com.apple.security.network.client: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.skribent.app
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        COMBINE_HIDPI_IMAGES: YES
    dependencies:
      - package: WhisperKit
      - package: FluidAudio
