name: Skribent
options:
  bundleIdPrefix: com.skribent
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    ENABLE_HARDENED_RUNTIME: YES

packages:
  WhisperKit:
    url: https://github.com/argmaxinc/WhisperKit
    from: "0.9.0"
  FluidAudio:
    url: https://github.com/FluidInference/FluidAudio
    from: "0.6.0"
  MLXSwiftLM:
    url: https://github.com/ml-explore/mlx-swift-lm
    branch: main
  swift-transformers:
    url: https://github.com/huggingface/swift-transformers
    from: "1.1.6"
  swift-huggingface:
    url: https://github.com/huggingface/swift-huggingface
    branch: main

targets:
  Skribent:
    type: application
    platform: macOS
    sources:
      - path: Skribent
        excludes:
          - "Resources/Info.plist"
          - "Resources/Skribent.entitlements"
    resources:
      - path: Skribent/Resources/Assets.xcassets
    info:
      path: Skribent/Resources/Info.plist
      properties:
        CFBundleName: Skribent
        CFBundleDisplayName: Skribent
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSMinimumSystemVersion: "26.0"
        NSMicrophoneUsageDescription: "Skribent potřebuje přístup k mikrofonu pro nahrávání přepisů."
        NSScreenCaptureUsageDescription: "Skribent zachytává systémový zvuk pro nahrávání schůzek a hovorů."
        NSHighResolutionCapable: true
    entitlements:
      path: Skribent/Resources/Skribent.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.device.audio-input: true
        com.apple.security.files.user-selected.read-write: true
        com.apple.security.network.client: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.skribent.app
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        COMBINE_HIDPI_IMAGES: YES
    dependencies:
      - package: WhisperKit
      - package: FluidAudio
      - package: MLXSwiftLM
        product: MLXLLM
      - package: MLXSwiftLM
        product: MLXLMCommon
      - package: MLXSwiftLM
        product: MLXHuggingFace
      - package: swift-transformers
        product: Hub
      - package: swift-transformers
        product: Tokenizers
      - package: swift-huggingface
        product: HuggingFace

  SkribentTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: SkribentTests
    dependencies:
      - target: Skribent
    settings:
      base:
        BUNDLE_LOADER: "$(TEST_HOST)"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Skribent.app/Contents/MacOS/Skribent"
        PRODUCT_BUNDLE_IDENTIFIER: com.skribent.app.tests
        GENERATE_INFOPLIST_FILE: YES
